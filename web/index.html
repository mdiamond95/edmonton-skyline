<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------------------
// Constants (docs/scope.md)
// ---------------------------------------------------------------------------
const DIST = './dist/';
const STATUS_ORDER = ['existing', 'construction', 'approved', 'proposed', 'stalled'];
const ENVELOPE_OPACITY = 0.5; // height_confidence = low (docs/scope.md render spec)
const STATUS_HEX = { existing: '#E4E3DF', construction: '#4E8FD1', approved: '#A995C9',
  proposed: '#E59CA5', stalled: '#E4E3DF' };
const STATUS_LABEL = { existing: 'Existing', construction: 'Under construction', approved: 'Approved',
  proposed: 'Proposed', stalled: 'Stalled' };
const PAL = { ground: '#EDECE8', road: '#C9C8C4', park: '#9CC08E', forest: '#9CC08E',
  water: '#8FB8D8', tree: '#7FA872', fog: '#E9ECEE' };
const SRC_HEX = ['#5CB85C', '#E4E3DF', '#F2C14E', '#D9534F', '#3FA7B5']; // city, lidar, osm, default, official
const SRC_NAMES = ['City height field', 'LiDAR DSM−DEM', 'OSM levels × 3.2', 'Default 8/12 m',
  'Official (existing row in proposals.csv)'];
const SUN_AZ = 200, SUN_EL = 42;              // degrees; azimuth clockwise from north
const FOG_START = 3000, FOG_DENSITY = 3.5e-5; // light exp² fog beginning 3 km out
// ...or at 85% of the distance to the orbit target when that is further, so the high overview
// (view 20, ~19 km out) is not veiled while the haze still falls off behind the subject.
const fogStart = { value: FOG_START };
const FOV = 35;
const TREE_CAP = 20000;
const RENDER_SIZES = { portrait: [2400, 3200], wide: [3840, 2160] };
// Safari/iPadOS limits: a 2D canvas may hold at most 16,777,216 px (4096²), and big WebGL
// render targets are what gets a tab killed. Renders are drawn in tiles no larger than this.
const CANVAS_MAX_PX = 16777216;
const TILE_MAX = 2048;       // px per side of one supersampled render tile
const SS = 2;                // supersampling per axis for exported PNGs
const params = new URLSearchParams(location.search);
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 1;
const LANDUSE_TEX = Math.min(Number(params.get('tex')) || 4096, IS_TOUCH ? 4096 : 8192); // 2.2 m/px at 4096

// exp² fog that starts fogStart metres from the camera (uniform added to every matte() material)
THREE.ShaderChunk.fog_pars_fragment = THREE.ShaderChunk.fog_pars_fragment.replace(
  'uniform float fogDensity;', 'uniform float fogDensity; uniform float fogStart;');
THREE.ShaderChunk.fog_fragment = `
#ifdef USE_FOG
  #ifdef FOG_EXP2
    float fogDist = max( 0.0, vFogDepth - fogStart );
    float fogFactor = 1.0 - exp( - fogDensity * fogDensity * fogDist * fogDist );
  #else
    float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
  #endif
  gl_FragColor.rgb = mix( gl_FragColor.rgb, fogColor, fogFactor );
#endif`;

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const setStatus = (html) => { statusEl.innerHTML = html; };

// ---------------------------------------------------------------------------
// Renderer, scene, lights
// ---------------------------------------------------------------------------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const MAX_PIXELS = 3.2e6; // cap the on-screen drawing buffer (iPad GPU memory)
renderer.info.autoReset = false; // one frame is several render() calls; reset per frame for the FPS panel
let contextLost = false;
canvas.addEventListener('webglcontextlost', (e) => {
  // iPadOS reclaims GPU memory from background tabs; the page must reload to rebuild buffers.
  e.preventDefault();
  contextLost = true;
  setStatus('The GPU context was lost (iPadOS frees GPU memory from background tabs). <a href="#" onclick="location.reload();return false">Reload</a>');
});
canvas.addEventListener('webglcontextrestored', () => location.reload());
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping; // keep the scope palette hex-faithful
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.fog);
scene.fog = new THREE.FogExp2(PAL.fog, FOG_DENSITY);

const camera = new THREE.PerspectiveCamera(FOV, 1, 5, 90000);

const sunDir = new THREE.Vector3(
  Math.sin(THREE.MathUtils.degToRad(SUN_AZ)) * Math.cos(THREE.MathUtils.degToRad(SUN_EL)),
  Math.sin(THREE.MathUtils.degToRad(SUN_EL)),
  -Math.cos(THREE.MathUtils.degToRad(SUN_AZ)) * Math.cos(THREE.MathUtils.degToRad(SUN_EL)));
// Matte architectural-model tone: a strong sky fill and a moderate key, so walls in shade stay
// light grey and shadows read soft. An upward face in full sun still equals its palette hex
// (key·sin42° + fill ≈ π), so ground, parks, water and roofs keep the scope colours.
const LIGHT = { key: 1.25, fill: 2.3, bounce: 0xdcdad3 };
const sun = new THREE.DirectionalLight(0xffffff, LIGHT.key);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.00015; // ≈ 1.8 m over the 12 km shadow depth range
sun.shadow.normalBias = 0;
sun.shadow.radius = 3;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xffffff, LIGHT.bounce, LIGHT.fill);
scene.add(hemi);

function matte(hex, extra = {}) {
  const m = new THREE.MeshStandardMaterial({ color: new THREE.Color(hex), roughness: 0.9, metalness: 0, ...extra });
  m.onBeforeCompile = (sh) => { sh.uniforms.fogStart = fogStart; };
  return m;
}

// ---------------------------------------------------------------------------
// Orbit / touch controls (three's OrbitControls is not on cdnjs)
// ---------------------------------------------------------------------------
class Orbit {
  constructor(cam, el, onChange) {
    Object.assign(this, { cam, el, onChange, enabled: true, target: new THREE.Vector3(), r: 3000, theta: 0, phi: 1.1,
      pointers: new Map(), groundAt: () => null, vel: { t: 0, p: 0 }, coasting: false, lastMove: 0, lastInput: 0 });
    el.addEventListener('pointerdown', (e) => this.enabled && this.down(e));
    el.addEventListener('pointermove', (e) => this.move(e));
    for (const t of ['pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(t, (e) => this.up(e));
    el.addEventListener('wheel', (e) => { e.preventDefault(); if (!this.enabled) return; this.coasting = false; this.zoom(Math.exp(e.deltaY * 0.0015)); },
      { passive: false });
    el.addEventListener('contextmenu', (e) => e.preventDefault());
    for (const t of ['gesturestart', 'gesturechange']) document.addEventListener(t, (e) => e.preventDefault());
  }
  // true while the view is changing: fingers down, coasting, or a wheel/pinch in the last 180 ms
  get busy() { return this.pointers.size > 0 || this.coasting || performance.now() - this.lastInput < 180; }
  down(e) {
    this.coasting = false;
    this.vel.t = this.vel.p = 0;
    this.lastInput = performance.now();
    try { this.el.setPointerCapture?.(e.pointerId); } catch { /* pointer already gone (iOS cancel races) */ }
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, button: e.button, shift: e.shiftKey || e.ctrlKey });
    if (this.pointers.size === 1) this.tap = { x: e.clientX, y: e.clientY, t: performance.now() };
    else this.tap = null;
    this.prevPair = this.pair();
  }
  pair() {
    if (this.pointers.size < 2) return null;
    const [a, b] = [...this.pointers.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }
  move(e) {
    const p = this.pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (this.tap && Math.hypot(e.clientX - this.tap.x, e.clientY - this.tap.y) > 6) this.tap = null;
    if (this.pointers.size >= 2) {
      const pr = this.pair();
      if (this.prevPair && pr) {
        if (pr.d > 0 && this.prevPair.d > 0) this.zoom(this.prevPair.d / pr.d);
        this.pan(pr.x - this.prevPair.x, pr.y - this.prevPair.y);
      }
      this.prevPair = pr;
    } else if (p.button === 2 || p.shift) {
      this.pan(dx, dy);
    } else {
      const h = this.el.clientHeight || 1;
      const dT = -dx * 2 * Math.PI / h * 0.6, dP = -dy * Math.PI / h * 0.6;
      this.theta += dT;
      this.phi += dP;
      // smoothed angular velocity (rad/ms) for the release coast; event timestamps, not handler
      // time, so a slow frame between move and release does not cancel the coast
      const dt = Math.max(4, e.timeStamp - this.lastMove);
      const cap = (v) => THREE.MathUtils.clamp(v, -0.006, 0.006);
      this.vel.t = cap(0.5 * this.vel.t + 0.5 * dT / dt);
      this.vel.p = cap(0.5 * this.vel.p + 0.5 * dP / dt);
      this.lastMove = e.timeStamp;
      this.apply();
    }
    this.lastInput = performance.now();
  }
  step(dt) {
    // release inertia: velocity decays ~22% per 16 ms frame, so a hard flick coasts ≲ 25°
    if (!this.coasting) return;
    this.theta += this.vel.t * dt;
    this.phi += this.vel.p * dt;
    const k = Math.pow(0.985, dt);
    this.vel.t *= k; this.vel.p *= k;
    if (Math.abs(this.vel.t) + Math.abs(this.vel.p) < 2e-5) this.coasting = false;
    this.apply();
  }
  up(e) {
    if (!this.pointers.has(e.pointerId)) return;
    this.pointers.delete(e.pointerId);
    this.prevPair = this.pair();
    if (e.type === 'pointerup' && this.tap && performance.now() - this.tap.t < 500) {
      this.onTap?.(e.clientX, e.clientY);
    }
    // coast only after a one-finger rotate that was still moving when released
    this.coasting = this.pointers.size === 0 && !this.tap && e.type === 'pointerup' && e.timeStamp - this.lastMove < 80 &&
      Math.abs(this.vel.t) + Math.abs(this.vel.p) > 1e-4;
    this.tap = null;
    this.lastInput = performance.now();
  }
  zoom(f) {
    this.r = THREE.MathUtils.clamp(this.r * f, 40, 40000);
    this.lastInput = performance.now();
    this.apply();
  }
  pan(dx, dy) {
    const h = this.el.clientHeight || 1;
    const s = 2 * this.r * Math.tan(THREE.MathUtils.degToRad(this.cam.fov / 2)) / h;
    const right = new THREE.Vector3().setFromMatrixColumn(this.cam.matrix, 0).setY(0).normalize();
    const fwd = new THREE.Vector3(Math.sin(this.theta), 0, Math.cos(this.theta));
    const k = Math.max(0.35, Math.cos(this.phi)) ; // flatter view → slower forward pan
    this.target.addScaledVector(right, -dx * s).addScaledVector(fwd, -dy * s / k);
    const g = this.groundAt(this.target.x, this.target.z);
    if (g !== null) this.target.y = g;
    this.apply();
  }
  set(pos, tgt) {
    this.coasting = false;
    this.target.copy(tgt);
    const d = pos.clone().sub(tgt);
    this.r = d.length();
    this.phi = Math.acos(THREE.MathUtils.clamp(d.y / this.r, -1, 1));
    this.theta = Math.atan2(d.x, d.z);
    this.apply();
  }
  apply() {
    this.phi = THREE.MathUtils.clamp(this.phi, 0.02, Math.PI / 2 - 0.03);
    const s = Math.sin(this.phi);
    this.cam.position.set(this.target.x + this.r * s * Math.sin(this.theta),
      this.target.y + this.r * Math.cos(this.phi), this.target.z + this.r * s * Math.cos(this.theta));
    this.cam.lookAt(this.target);
    this.cam.near = THREE.MathUtils.clamp(this.r * 0.02, 1, 150);
    this.cam.far = 90000;
    this.cam.updateProjectionMatrix();
    this.cam.updateMatrixWorld();
    this.onChange?.();
  }
}

// ---------------------------------------------------------------------------
// Loaders: 16-bit PNG heightmap, GLB (KHR_mesh_quantization), JSON
// ---------------------------------------------------------------------------
async function getJSON(name) {
  const r = await fetch(DIST + name);
  if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
  return r.json();
}

async function decodePNG16(buf) {
  // Minimal PNG decoder for 16-bit greyscale (browsers' image decoders drop to 8 bits).
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let p = 8, w = 0, h = 0, depth = 0, ctype = 0, interlace = 0;
  const idat = [];
  while (p < u8.length) {
    const len = dv.getUint32(p);
    const type = String.fromCharCode(u8[p + 4], u8[p + 5], u8[p + 6], u8[p + 7]);
    if (type === 'IHDR') { w = dv.getUint32(p + 8); h = dv.getUint32(p + 12); depth = u8[p + 16];
      ctype = u8[p + 17]; interlace = u8[p + 20]; }
    else if (type === 'IDAT') idat.push(u8.subarray(p + 8, p + 8 + len));
    else if (type === 'IEND') break;
    p += 12 + len;
  }
  if (depth !== 16 || ctype !== 0 || interlace) throw new Error('terrain.png must be 16-bit greyscale, non-interlaced');
  const stream = new Blob(idat).stream().pipeThrough(new DecompressionStream('deflate'));
  const raw = new Uint8Array(await new Response(stream).arrayBuffer());
  const stride = w * 2, bpp = 2, out = new Uint8Array(h * stride);
  for (let y = 0; y < h; y++) {
    const f = raw[y * (stride + 1)], s = y * (stride + 1) + 1, d = y * stride, pr = d - stride;
    for (let x = 0; x < stride; x++) {
      const a = x >= bpp ? out[d + x - bpp] : 0, b = y ? out[pr + x] : 0, c = x >= bpp && y ? out[pr + x - bpp] : 0;
      let v = raw[s + x];
      if (f === 1) v += a; else if (f === 2) v += b; else if (f === 3) v += (a + b) >> 1;
      else if (f === 4) { const pa = Math.abs(b - c), pb = Math.abs(a - c), pc = Math.abs(a + b - 2 * c);
        v += pa <= pb && pa <= pc ? a : pb <= pc ? b : c; }
      out[d + x] = v;
    }
  }
  const vals = new Uint16Array(w * h);
  for (let i = 0; i < vals.length; i++) vals[i] = (out[2 * i] << 8) | out[2 * i + 1];
  return { w, h, vals };
}

async function loadGLB(name) {
  // Reader for the GLB written by scripts/fetch_base.py (three's GLTFLoader is not on cdnjs).
  const r = await fetch(DIST + name);
  if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
  const buf = await r.arrayBuffer();
  const dv = new DataView(buf);
  if (dv.getUint32(0, true) !== 0x46546C67) throw new Error('not a GLB');
  const jsonLen = dv.getUint32(12, true);
  const json = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 20, jsonLen)));
  const binStart = 20 + jsonLen + 8;
  const view = (i) => { const v = json.bufferViews[i]; return { off: binStart + (v.byteOffset || 0), len: v.byteLength, stride: v.byteStride }; };
  const node = json.nodes[0], mesh = json.meshes[node.mesh];
  const T = node.translation || [0, 0, 0], S = node.scale || [1, 1, 1];
  const prims = mesh.primitives.map((pr) => {
    const pa = json.accessors[pr.attributes.POSITION], pv = view(pa.bufferView);
    const n = pa.count, stride = (pv.stride || 6) / 2;
    const q = new Uint16Array(buf.slice(pv.off, pv.off + pv.len));
    const pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) for (let k = 0; k < 3; k++) pos[i * 3 + k] = q[i * stride + k] * S[k] + T[k];
    const ca = json.accessors[pr.attributes.COLOR_0], cv = view(ca.bufferView);
    const c4 = new Uint8Array(buf, cv.off, n * 4), col = new Uint8Array(n * 3);
    for (let i = 0; i < n; i++) { col[i * 3] = c4[i * 4]; col[i * 3 + 1] = c4[i * 4 + 1]; col[i * 3 + 2] = c4[i * 4 + 2]; }
    const ia = json.accessors[pr.indices], iv = view(ia.bufferView);
    const idx = new Uint16Array(buf.slice(iv.off, iv.off + ia.count * 2));
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3, true));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.computeBoundingSphere();
    g.computeBoundingBox();
    return g;
  });
  const tb = mesh.extras?.buildingTable;
  let table = new Uint32Array(0);
  if (tb) { const v = view(tb.bufferView); table = new Uint32Array(buf.slice(v.off, v.off + v.len)); }
  return { prims, table, extras: json.extras || {} };
}

// ---------------------------------------------------------------------------
// World
// ---------------------------------------------------------------------------
const world = { terrain: null, heights: null, tmeta: null, datum: 0, buildings: [], table: null,
  proposals: [], propMeshes: [], cameras: [], dataDate: null, currentCam: null, origColors: [] };

function toWorld(e, n, elev) { return new THREE.Vector3(e, elev - world.datum, -n); }

function heightAt(x, z) {
  // bilinear sample of the heightmap at world x (east) / z (-north) → y
  const m = world.tmeta, H = world.heights;
  if (!H) return 0;
  const fx = THREE.MathUtils.clamp((x - m.extent.xmin) / (m.extent.xmax - m.extent.xmin) * (m.width - 1), 0, m.width - 1.001);
  const fy = THREE.MathUtils.clamp((m.extent.ymax - (-z)) / (m.extent.ymax - m.extent.ymin) * (m.height - 1), 0, m.height - 1.001);
  const x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0, w = m.width;
  const a = H[y0 * w + x0], b = H[y0 * w + x0 + 1], c = H[(y0 + 1) * w + x0], d = H[(y0 + 1) * w + x0 + 1];
  return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
}

async function buildTerrain() {
  const m = world.tmeta = await getJSON('terrain.json');
  world.datum = m.elevation.datum;
  const png = await (await fetch(DIST + m.heightmap)).arrayBuffer();
  const { w, h, vals } = await decodePNG16(png);
  const H = world.heights = new Float32Array(w * h);
  const off = m.elevation.offset - world.datum, sc = m.elevation.scale;
  for (let i = 0; i < H.length; i++) H[i] = off + vals[i] * sc;
  // mesh: subsample to a vertex budget (GPU memory on iPad)
  const step = Math.max(1, Math.ceil(Math.sqrt(w * h / 6e5)));
  const nx = Math.floor((w - 1) / step) + 1, ny = Math.floor((h - 1) / step) + 1;
  const pos = new Float32Array(nx * ny * 3), uv = new Float32Array(nx * ny * 2);
  const { xmin, xmax, ymin, ymax } = m.extent;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const k = j * nx + i, px = i * step, py = j * step;
    const e = xmin + px / (w - 1) * (xmax - xmin), n = ymax - py / (h - 1) * (ymax - ymin);
    pos[k * 3] = e; pos[k * 3 + 1] = H[py * w + px]; pos[k * 3 + 2] = -n;
    uv[k * 2] = (e - xmin) / (xmax - xmin); uv[k * 2 + 1] = (n - ymin) / (ymax - ymin);
  }
  const idx = new Uint32Array((nx - 1) * (ny - 1) * 6);
  let t = 0;
  for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
    const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
    idx[t++] = a; idx[t++] = c; idx[t++] = b; idx[t++] = b; idx[t++] = c; idx[t++] = d;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, matte(PAL.ground));
  mesh.receiveShadow = true;
  mesh.name = 'terrain';
  scene.add(mesh);
  world.terrain = mesh;
}

async function buildLanduse() {
  const lu = await getJSON('landuse.json');
  const m = world.tmeta, { xmin, xmax, ymin, ymax } = m.extent;
  const draw = (size, colours) => {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const cx = cv.getContext('2d');
    cx.fillStyle = colours.ground; cx.fillRect(0, 0, size, size);
    const sx = size / (xmax - xmin), sy = size / (ymax - ymin);
    for (const cls of ['park', 'forest', 'water', 'road']) {
      const polys = lu.classes[cls];
      if (!polys || !colours[cls]) continue;
      cx.fillStyle = colours[cls];
      const path = new Path2D();
      for (const poly of polys) for (const ring of poly) {
        for (let i = 0; i < ring.length; i += 2) {
          const X = (ring[i] - xmin) * sx, Y = (ymax - ring[i + 1]) * sy;
          if (i === 0) path.moveTo(X, Y); else path.lineTo(X, Y);
        }
        path.closePath();
      }
      cx.fill(path, 'evenodd');
    }
    return cv;
  };
  const maxTex = renderer.capabilities.maxTextureSize;
  const cv = draw(Math.min(LANDUSE_TEX, maxTex), PAL);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  // Upload now, then shrink the 2D canvas: Safari counts canvas backing stores against the page
  // (a 4096² canvas is 64 MB) and the GPU copy is all that is needed from here on.
  renderer.initTexture(tex);
  world.landuseTexSize = cv.width;
  cv.width = cv.height = 1;
  world.terrain.material.map = tex;
  world.terrain.material.color.set(0xffffff);
  world.terrain.material.needsUpdate = true;
  // class raster for tree placement (R channel codes)
  const cls = draw(1024, { ground: '#000000', park: '#010000', forest: '#020000', water: '#030000', road: '#040000' });
  return { data: cls.getContext('2d').getImageData(0, 0, 1024, 1024).data, size: 1024 };
}

function buildingOccupancy(N = 2048) {
  // N×N grid over the extent marking each base building's bounding box, so trees stay off roofs.
  const { xmin, xmax, ymin, ymax } = world.tmeta.extent, T = world.table;
  const occ = new Uint8Array(N * N), sx = N / (xmax - xmin), sy = N / (ymax - ymin);
  for (let b = 0; b < T.length / 4; b++) {
    const pos = world.buildings[T[b * 4]].geometry.attributes.position.array;
    let x0 = Infinity, x1 = -Infinity, n0 = Infinity, n1 = -Infinity;
    for (let v = T[b * 4 + 1]; v < T[b * 4 + 1] + T[b * 4 + 2]; v++) {
      const x = pos[v * 3], n = -pos[v * 3 + 2];
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (n < n0) n0 = n; if (n > n1) n1 = n;
    }
    if (x1 - x0 < 0.5) continue; // hidden (collapsed) building
    const i0 = Math.max(0, Math.floor((x0 - xmin) * sx)), i1 = Math.min(N - 1, Math.floor((x1 - xmin) * sx));
    const j0 = Math.max(0, Math.floor((ymax - n1) * sy)), j1 = Math.min(N - 1, Math.floor((ymax - n0) * sy));
    for (let j = j0; j <= j1; j++) occ.fill(1, j * N + i0, j * N + i1 + 1);
  }
  return { occ, N };
}

function buildTrees(clsmap, occupancy) {
  // Low-poly instanced trees on park / forest polygons (deterministic, capped at TREE_CAP).
  let seed = 20240101;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const { xmin, xmax, ymin, ymax } = world.tmeta.extent, S = clsmap.size;
  let forestPx = 0, parkPx = 0;
  for (let i = 0; i < S * S; i++) { const c = clsmap.data[i * 4]; if (c === 2) forestPx++; else if (c === 1) parkPx++; }
  const pxArea = (xmax - xmin) * (ymax - ymin) / (S * S);
  const want = { 2: forestPx * pxArea / 110, 1: parkPx * pxArea / 700 };
  const total = want[1] + want[2];
  const scale = total > TREE_CAP ? TREE_CAP / total : 1;
  const accept = { 1: want[1] * scale / Math.max(1, parkPx), 2: want[2] * scale / Math.max(1, forestPx) };
  const pts = { conifer: [], broad: [] };
  const tries = TREE_CAP * 60;
  const areaPerTry = S * S / tries;
  for (let k = 0; k < tries && pts.conifer.length + pts.broad.length < TREE_CAP; k++) {
    const u = rnd(), v = rnd();
    const c = clsmap.data[(Math.floor(v * S) * S + Math.floor(u * S)) * 4];
    if (c !== 1 && c !== 2) continue;
    if (rnd() > accept[c] * areaPerTry) continue;
    if (occupancy.occ[Math.floor(v * occupancy.N) * occupancy.N + Math.floor(u * occupancy.N)]) continue;
    const x = xmin + u * (xmax - xmin), z = -(ymax - v * (ymax - ymin));
    const s = 0.75 + rnd() * 0.6;
    (c === 2 && rnd() < 0.4 ? pts.conifer : pts.broad).push([x, heightAt(x, z), z, s, rnd() * Math.PI]);
  }
  const mat = matte(PAL.tree, { flatShading: true });
  const make = (geo, list) => {
    if (!list.length) return;
    const im = new THREE.InstancedMesh(geo, mat, list.length);
    const o = new THREE.Object3D();
    list.forEach(([x, y, z, s, r], i) => { o.position.set(x, y, z); o.scale.setScalar(s); o.rotation.y = r;
      o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
    im.castShadow = im.receiveShadow = true;
    im.computeBoundingSphere();
    scene.add(im);
  };
  const broad = new THREE.IcosahedronGeometry(4.2, 0); broad.scale(1, 1.25, 1); broad.translate(0, 7.5, 0);
  const trunk = new THREE.CylinderGeometry(0.35, 0.45, 3.5, 5); trunk.translate(0, 1.75, 0);
  const cone = new THREE.ConeGeometry(3, 13, 6); cone.translate(0, 8, 0);
  make(mergeGeoms([broad, trunk]), pts.broad);
  make(mergeGeoms([cone, trunk]), pts.conifer);
  return pts.broad.length + pts.conifer.length;
}

function mergeGeoms(list) {
  const geos = list.map((g) => g.index ? g.toNonIndexed() : g);
  const n = geos.reduce((s, g) => s + g.attributes.position.count, 0);
  const pos = new Float32Array(n * 3);
  let o = 0;
  for (const g of geos) { pos.set(g.attributes.position.array, o); o += g.attributes.position.array.length; }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.computeVertexNormals();
  return out;
}

async function buildBase() {
  const glb = await loadGLB('base.glb');
  // Walls/roofs are flat-shaded from screen-space derivatives, so the GLB carries no normals;
  // a constant up-normal keeps three's shadow code (normal bias) well-defined.
  const mat = matte('#ffffff', { vertexColors: true, flatShading: true });
  mat.defaultAttributeValues = { ...mat.defaultAttributeValues, normal: [0, 1, 0] };
  world.baseMat = mat;
  world.buildings = glb.prims.map((g) => {
    const m = new THREE.Mesh(g, mat);
    m.castShadow = m.receiveShadow = true;
    m.name = 'base';
    scene.add(m);
    return m;
  });
  world.table = glb.table;
  world.origColors = glb.prims.map((g) => g.attributes.color.array.slice());
  return glb.table.length / 4;
}

function pointInRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 2; i < ring.length; j = i, i += 2) {
    const xi = ring[i], yi = ring[i + 1], xj = ring[j], yj = ring[j + 1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function pointInPoly(x, y, poly) {
  if (!pointInRing(x, y, poly[0])) return false;
  for (let k = 1; k < poly.length; k++) if (pointInRing(x, y, poly[k])) return false;
  return true;
}

function collapseBuilding(b) {
  // Hide one base building by collapsing its vertices onto its first vertex (zero-area triangles).
  const T = world.table, prim = T[b * 4], first = T[b * 4 + 1], count = T[b * 4 + 2];
  const pos = world.buildings[prim].geometry.attributes.position.array;
  for (let v = first + 1; v < first + count; v++) {
    pos[v * 3] = pos[first * 3]; pos[v * 3 + 1] = pos[first * 3 + 1]; pos[v * 3 + 2] = pos[first * 3 + 2];
  }
  return prim;
}

function hideBaseUnderProposals(pj) {
  // scripts/build_proposals.py lists the base buildings under each footprint (hide_base). Those
  // indices only fit the base.glb they were computed from; otherwise fall back to a local test.
  const T = world.table, dirty = new Set();
  let hidden = 0;
  if (pj.base_glb && pj.base_glb.buildings === T.length / 4) {
    for (const p of pj.proposals) for (const b of p.hide_base || []) { dirty.add(collapseBuilding(b)); hidden++; }
    for (const k of dirty) world.buildings[k].geometry.attributes.position.needsUpdate = true;
    return hidden;
  }
  console.warn('proposals.json was built against a different base.glb; run `make build`');
  const polys = [];
  for (const p of world.proposals) for (const poly of p.footprint) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let i = 0; i < poly[0].length; i += 2) { x0 = Math.min(x0, poly[0][i]); x1 = Math.max(x1, poly[0][i]);
      y0 = Math.min(y0, poly[0][i + 1]); y1 = Math.max(y1, poly[0][i + 1]); }
    polys.push({ poly, x0, x1, y0, y1 });
  }
  for (let b = 0; b < T.length / 4; b++) {
    const prim = T[b * 4], first = T[b * 4 + 1], count = T[b * 4 + 2];
    const pos = world.buildings[prim].geometry.attributes.position.array;
    let cx = 0, cy = 0;
    for (let v = first; v < first + count; v++) { cx += pos[v * 3]; cy -= pos[v * 3 + 2]; }
    cx /= count; cy /= count;
    for (const P of polys) {
      if (cx < P.x0 - 60 || cx > P.x1 + 60 || cy < P.y0 - 60 || cy > P.y1 + 60) continue;
      let inside = pointInPoly(cx, cy, P.poly) ? count : 0;
      if (!inside) for (let v = first; v < first + count; v++) inside += pointInPoly(pos[v * 3], -pos[v * 3 + 2], P.poly);
      if (inside >= count * 0.5) {
        dirty.add(collapseBuilding(b));
        hidden++;
        break;
      }
    }
  }
  for (const k of dirty) world.buildings[k].geometry.attributes.position.needsUpdate = true;
  return hidden;
}

async function buildProposals() {
  const pj = await getJSON('proposals.json');
  world.proposals = pj.proposals;
  world.dataDate = pj.data_date;
  // height_confidence = low: an envelope (height ceiling, no confirmed design) in the status colour at
  // 50% opacity with its edges drawn. It receives shadows but casts none, and stays out of the SSAO
  // depth pass like every transparent mesh. Stalled rows keep their 25%.
  const mats = {}, envMats = {}, edgeMats = {};
  for (const s of STATUS_ORDER) {
    mats[s] = matte(STATUS_HEX[s], s === 'stalled' ? { transparent: true, opacity: 0.25, depthWrite: false } : {});
    envMats[s] = matte(STATUS_HEX[s], { transparent: true, opacity: s === 'stalled' ? 0.25 : ENVELOPE_OPACITY, depthWrite: false });
    edgeMats[s] = new THREE.LineBasicMaterial({ color: new THREE.Color(STATUS_HEX[s]).multiplyScalar(0.72), transparent: true, opacity: 0.85 });
  }
  for (const p of pj.proposals) {
    // Each part (tower) of a footprint is seated on its own ground: the top is the median ground
    // along its outline + height_m; the bottom goes 1.5 m below the lowest terrain anywhere under it
    // (outline and an interior grid), so no sliver of ground shows under a big footprint on a slope.
    const parts = [], geoms = [];
    for (const [pi, poly] of p.footprint.entries()) {
      const h = (p.part_heights && p.part_heights[pi]) || p.height_m;   // per-tower heights (multi-tower rows)
      const toV = (ring) => { const v = []; for (let i = 0; i < ring.length; i += 2) v.push(new THREE.Vector2(ring[i], ring[i + 1])); return v; };
      const sh = new THREE.Shape(toV(poly[0]));
      for (let k = 1; k < poly.length; k++) sh.holes.push(new THREE.Path(toV(poly[k])));
      const edge = [];
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (let i = 0; i < poly[0].length; i += 2) {
        const x = poly[0][i], y = poly[0][i + 1];
        edge.push(heightAt(x, -y));
        x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
      }
      edge.sort((a, b) => a - b);
      let lo = edge[0];
      const step = Math.max(1, Math.max(x1 - x0, y1 - y0) / 40);
      for (let x = x0 + step / 2; x < x1; x += step) for (let y = y0 + step / 2; y < y1; y += step) {
        if (pointInPoly(x, y, poly)) lo = Math.min(lo, heightAt(x, -y));
      }
      const base = lo - 1.5, ref = edge[Math.floor(edge.length / 2)];
      const g = new THREE.ExtrudeGeometry(sh, { depth: ref + h - base, bevelEnabled: false });
      g.rotateX(-Math.PI / 2);
      g.translate(0, base, 0);
      geoms.push(g);
      parts.push({ base, ref, top: ref + h });
    }
    const g = geoms.length === 1 ? geoms[0] : mergeGeoms(geoms);
    const envelope = p.height_confidence === 'low';
    const mesh = new THREE.Mesh(g, (envelope ? envMats : mats)[p.status]);
    mesh.castShadow = p.status !== 'stalled' && !envelope;
    mesh.receiveShadow = true;
    mesh.userData.proposal = p;
    mesh.userData.parts = parts;
    if (envelope) {
      mesh.renderOrder = 1;
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g, 30), edgeMats[p.status]);
      edges.raycast = () => {};
      mesh.add(edges);
    }
    scene.add(mesh);
    world.propMeshes.push(mesh);
  }
  return pj;
}

// ---------------------------------------------------------------------------
// SSAO (depth-only pre-pass → SAO-style occlusion → bilateral blur → multiply)
// ---------------------------------------------------------------------------
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
const fsScene = new THREE.Scene(); fsScene.add(fsQuad);
const VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const depthMat = new THREE.MeshBasicMaterial({ colorWrite: false, fog: false });
const aoMat = new THREE.ShaderMaterial({
  uniforms: { tDepth: { value: null }, res: { value: new THREE.Vector2() }, projInv: { value: new THREE.Matrix4() },
    proj: { value: new THREE.Matrix4() }, radius: { value: 8 }, fogStart: { value: FOG_START }, fogDensity: { value: FOG_DENSITY } },
  vertexShader: VS, depthTest: false, depthWrite: false,
  fragmentShader: `
    uniform sampler2D tDepth; uniform vec2 res; uniform mat4 projInv, proj; uniform float radius, fogStart, fogDensity;
    varying vec2 vUv;
    vec3 vpos(vec2 uv) { float d = texture2D(tDepth, uv).x; vec4 v = projInv * vec4(vec3(uv, d) * 2.0 - 1.0, 1.0); return v.xyz / v.w; }
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {

      vec3 P = vpos(vUv);
      vec2 tx = 1.0 / res;
      vec3 pr = vpos(vUv + vec2(tx.x, 0.0)), pl = vpos(vUv - vec2(tx.x, 0.0));
      vec3 pu = vpos(vUv + vec2(0.0, tx.y)), pd = vpos(vUv - vec2(0.0, tx.y));
      vec3 dx = abs(pr.z - P.z) < abs(P.z - pl.z) ? pr - P : P - pl;
      vec3 dy = abs(pu.z - P.z) < abs(P.z - pd.z) ? pu - P : P - pd;
      vec3 N = normalize(cross(dx, dy));
      float rs = radius * proj[1][1] / max(-P.z, 1e-3) * 0.5;   // radius in uv (vertical)
      if (rs < 1.5 * tx.y) { gl_FragColor = vec4(1.0); return; }

      float ang = hash(gl_FragCoord.xy) * 6.2831853;

      const int SAMPLES = 16;
      for (int i = 0; i < SAMPLES; i++) {
        float t = (float(i) + 0.5) / float(SAMPLES);

        vec2 off = vec2(cos(a) * res.y / res.x, sin(a)) * t * rs;
        vec3 S = vpos(vUv + off);

        occ += max(dot(v / max(l, 1e-4), N) - 0.12, 0.0) * f;
      }
      float ao = 1.0 - 1.35 * occ / float(SAMPLES);

      gl_FragColor = vec4(vec3(mix(clamp(ao, 0.0, 1.0), 1.0, fog)), 1.0);
    }`,
});
const blurMat = new THREE.ShaderMaterial({
  uniforms: { tAO: { value: null }, tDepth: { value: null }, dir: { value: new THREE.Vector2() }, projInv: { value: new THREE.Matrix4() } },
  vertexShader: VS, depthTest: false, depthWrite: false,
  fragmentShader: `
    uniform sampler2D tAO, tDepth; uniform vec2 dir; uniform mat4 projInv; varying vec2 vUv;
    float lz(vec2 uv) { float d = texture2D(tDepth, uv).x; vec4 v = projInv * vec4(vec3(uv, d) * 2.0 - 1.0, 1.0); return v.z / v.w; }
    void main() {
      float z0 = lz(vUv), sum = 0.0, wsum = 0.0;
      for (int i = -3; i <= 3; i++) {
        vec2 uv = vUv + dir * float(i);
        float w = exp(-float(i * i) / 8.0) * exp(-abs(lz(uv) - z0) / (0.02 * abs(z0) + 0.5));
        sum += texture2D(tAO, uv).r * w; wsum += w;

  uniforms: { tAO: { value: null } }, vertexShader: VS, depthTest: false, depthWrite: false, transparent: true,
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.ZeroFactor, blendDst: THREE.SrcColorFactor,
  fragmentShader: `uniform sampler2D tAO; varying vec2 vUv; void main(){ gl_FragColor = vec4(vec3(texture2D(tAO, vUv).r), 1.0); }`,
});
const copyMat = new THREE.ShaderMaterial({ // 2×2 box downsample (bilinear tap at the block centre)
  uniforms: { tSrc: { value: null } }, vertexShader: VS, depthTest: false, depthWrite: false,
  fragmentShader: `uniform sampler2D tSrc; varying vec2 vUv; void main(){ gl_FragColor = texture2D(tSrc, vUv); }`,
});

const aoTargets = { w: 0, h: 0 };
function ensureAOTargets(w, h) {
  if (aoTargets.w === w && aoTargets.h === h) return aoTargets;
  for (const k of ['depth', 'a', 'b']) aoTargets[k]?.dispose();
  const depth = new THREE.WebGLRenderTarget(w, h, { depthTexture: new THREE.DepthTexture(w, h), samples: 0 });
  depth.depthTexture.minFilter = depth.depthTexture.magFilter = THREE.NearestFilter;
  const opts = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false };
  Object.assign(aoTargets, { w, h, depth, a: new THREE.WebGLRenderTarget(w, h, opts), b: new THREE.WebGLRenderTarget(w, h, opts) });
  return aoTargets;
}

function drawFS(mat, target) { fsQuad.material = mat; renderer.setRenderTarget(target); renderer.render(fsScene, fsCam); }

function renderScene(target, w, h, withAO) {
  fogStart.value = Math.max(FOG_START, 0.85 * camera.position.distanceTo(orbit.target));
  // main pass
  renderer.autoClear = true;
  renderer.shadowMap.needsUpdate = shadowDirty;
  shadowDirty = false;
  renderer.setRenderTarget(target);
  renderer.render(scene, camera);
  if (!withAO) return;
  const aw = Math.max(1, Math.round(w / 2)), ah = Math.max(1, Math.round(h / 2));
  const T = ensureAOTargets(aw, ah);
  // depth pre-pass (opaque geometry only)
  const hideT = world.propMeshes.filter((m) => m.material.transparent);
  hideT.forEach((m) => { m.visible = false; });
  const bg = scene.background;
  scene.background = null;
  scene.overrideMaterial = depthMat;
  renderer.setRenderTarget(T.depth);
  renderer.clear();
  renderer.render(scene, camera);
  scene.overrideMaterial = null;
  scene.background = bg;
  hideT.forEach((m) => { m.visible = true; });
  // occlusion + blur
  const dist = camera.position.distanceTo(orbit.target);
  aoMat.uniforms.tDepth.value = T.depth.depthTexture;
  aoMat.uniforms.res.value.set(aw, ah);
  aoMat.uniforms.projInv.value.copy(camera.projectionMatrixInverse);
  aoMat.uniforms.proj.value.copy(camera.projectionMatrix);
  aoMat.uniforms.radius.value = THREE.MathUtils.clamp(dist * 0.004, 3, 30);
  aoMat.uniforms.fogStart.value = fogStart.value;
  drawFS(aoMat, T.a);
  blurMat.uniforms.tDepth.value = T.depth.depthTexture;
  blurMat.uniforms.projInv.value.copy(camera.projectionMatrixInverse);
  blurMat.uniforms.tAO.value = T.a.texture; blurMat.uniforms.dir.value.set(1 / aw, 0); drawFS(blurMat, T.b);
  blurMat.uniforms.tAO.value = T.b.texture; blurMat.uniforms.dir.value.set(0, 1 / ah); drawFS(blurMat, T.a);
  // multiply onto the frame
  renderer.autoClear = false;
  compMat.uniforms.tAO.value = T.a.texture;
  drawFS(compMat, target);
  renderer.autoClear = true;
}

let shadowDirty = true;
const shadowFit = { c: new THREE.Vector3(Infinity, 0, 0), R: 0 };
function fitShadow(cam, target, force = false) {
  // Refit (and re-render the shadow map) only when the view has moved enough to need it:
  // pure rotation keeps the same box, so orbiting skips the shadow pass entirely.
  const dist = cam.position.distanceTo(target);
  const R = THREE.MathUtils.clamp(dist * 0.9, 400, 6500);
  if (!force && shadowFit.c.distanceTo(target) < 0.1 * shadowFit.R && Math.abs(R / shadowFit.R - 1) < 0.15) return;
  shadowFit.c.copy(target); shadowFit.R = R;
  shadowDirty = true;
  const c = target.clone();
  sun.target.position.copy(c);
  sun.position.copy(c).addScaledVector(sunDir, 6000);
  const sc = sun.shadow.camera;
  sc.left = -R; sc.right = R; sc.top = R; sc.bottom = -R; sc.near = 100; sc.far = 12000;
  sc.updateProjectionMatrix();
  sun.target.updateMatrixWorld();
  sun.updateMatrixWorld();
}

// ---------------------------------------------------------------------------
// Interactive loop
// ---------------------------------------------------------------------------
let needsRender = true;
const requestRender = () => { needsRender = true; };
const orbit = new Orbit(camera, canvas, requestRender);
orbit.groundAt = (x, z) => world.heights ? heightAt(x, z) : null;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const pr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(MAX_PIXELS / (w * h)));
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  // render-frame guide (vertical FOV is shared, so the render is a centred crop/extension)
  const [RW, RH] = RENDER_SIZES[$('aspect').value];
  const fh = h, fw = h * RW / RH;
  const f = $('frame');
  Object.assign(f.style, { display: 'block', left: `${(w - fw) / 2}px`, top: '0px', width: `${fw}px`, height: `${fh}px` });
  if (trace.on) traceView();
  requestRender();
}
window.addEventListener('resize', resize);
$('aspect').addEventListener('change', resize);

// While the view is moving, frames skip SSAO (the most expensive pass on iPad); the first
// frame after it settles is drawn at full quality.
let lastT = performance.now(), wasBusy = false, rendering = false;
const stats = { frames: 0, since: performance.now(), ms: 0, calls: 0, tris: 0 };
function loop(now) {
  const dt = Math.min(50, now - lastT); lastT = now;
  orbit.step(dt);
  const busy = orbit.busy;
  if (world.terrain && !rendering && !contextLost && (needsRender || (wasBusy && !busy))) {
    needsRender = false;
    const t0 = performance.now();
    renderer.info.reset();
    if (trace.on) renderTrace();
    else {
      fitShadow(camera, orbit.target);
      const b = renderer.getDrawingBufferSize(new THREE.Vector2());
      renderScene(null, b.x, b.y, $('ssao').checked && !busy);
    }
    stats.frames++;
    stats.ms = 0.8 * stats.ms + 0.2 * (performance.now() - t0);
    stats.calls = renderer.info.render.calls; stats.tris = renderer.info.render.triangles;
  }
  wasBusy = busy;
  requestAnimationFrame(loop);
}

function gpuMemoryMB() {
  // Estimate of what this page holds on the GPU: vertex/index/instance buffers, textures,
  // shadow map, drawing buffer (4× MSAA colour + depth, plus resolve) and SSAO targets.
  let bytes = 0;
  const seen = new Set();
  scene.traverse((o) => {
    const g = o.geometry;
    if (o.isInstancedMesh) bytes += o.instanceMatrix.array.byteLength;
    if (!g || seen.has(g)) return;
    seen.add(g);
    for (const a of Object.values(g.attributes)) bytes += a.array.byteLength;
    if (g.index) bytes += g.index.array.byteLength;
  });
  const map = world.terrain?.material.map;
  if (map) bytes += world.landuseTexSize ** 2 * 4 * 4 / 3;
  const sm = sun.shadow.mapSize;
  bytes += sm.x * sm.y * 8;
  const b = renderer.getDrawingBufferSize(new THREE.Vector2());
  bytes += b.x * b.y * (4 * 4 + 4 * 4 + 4);
  if (aoTargets.w > 1) bytes += aoTargets.w * aoTargets.h * 16;
  return bytes / 1048576;
}

function updateFPS() {
  const el = $('fps');
  if (el.hidden) return;
  const now = performance.now(), secs = (now - stats.since) / 1000;
  const fps = stats.frames / secs;
  stats.frames = 0; stats.since = now;
  const b = renderer.getDrawingBufferSize(new THREE.Vector2());
  el.textContent = `${fps < 0.5 ? 'idle (draws on change)' : fps.toFixed(0) + ' fps'}\n` +
    `${stats.ms.toFixed(1)} ms CPU/frame\n${stats.calls} draws · ${(stats.tris / 1e6).toFixed(2)} M tris\n` +
    `GPU ≈ ${gpuMemoryMB().toFixed(0)} MB · ${b.x}×${b.y}`;
}
setInterval(updateFPS, 500);
$('fpstog').addEventListener('change', (e) => { $('fps').hidden = !e.target.checked; stats.since = performance.now(); stats.frames = 0; updateFPS(); });

// ---------------------------------------------------------------------------
// UI: legend, cameras, popup, copy camera, height-source debug

function buildLegend() {

    `<div><i style="background:${STATUS_HEX[s]};${s === 'stalled' ? 'opacity:.25' : ''}"></i>${STATUS_LABEL[s]}</div>`).join('') +
    `<div class="env"><i style="background:${STATUS_HEX.proposed};opacity:${ENVELOPE_OPACITY};border-style:dashed"></i>translucent = height ceiling, no confirmed design</div>` +
    (world.dataDate ? `<div class="date">Data as of ${world.dataDate}</div>` : '');

function buildCameraPicker(cams) {
  world.cameras = cams.cameras;

  sel.innerHTML = '<option value="">Free view</option>' + cams.cameras.map((c) =>
    `<option value="${c.id}" ${c.position ? '' : 'disabled'}>${c.id} ${c.name}${c.position ? '' : ' (not set)'}</option>`).join('');
  sel.addEventListener('change', () => applyCamera(sel.value));

const ASPECT_KEY = { '16:9': 'wide', '3:4': 'portrait' }; // cameras.json "aspect" -> RENDER_SIZES key

function applyCamera(id) {
  const c = world.cameras.find((k) => k.id === id);
  world.currentCam = c || null;
  if (!c || !c.position) return;
  // per-view output aspect (e.g. view 20 is 16:9); the picker can still override it before rendering
  const ak = ASPECT_KEY[c.aspect] || 'portrait';
  if ($('aspect').value !== ak) { $('aspect').value = ak; resize(); }
  camera.fov = c.fov || FOV;
  orbit.set(toWorld(...c.position), toWorld(...c.target));
}

function cameraJSON() {
  const p = camera.position, t = orbit.target, r = (v) => Math.round(v);
  return { position: [r(p.x), r(-p.z), r(p.y + world.datum)], target: [r(t.x), r(-t.z), r(t.y + world.datum)], fov: camera.fov };
}

$('copycam').addEventListener('click', async () => {

$('ssao').addEventListener('change', requestRender);

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const raycaster = new THREE.Raycaster();
orbit.onTap = (x, y) => {

    <tr><td>Height</td><td>${p.height_m.toFixed(0)} m${p.storeys ? ` · ${p.storeys} storeys` : ''}${p.height_confidence === 'low' ? ' (ceiling)' : ''}</td></tr>
    ${p.height_confidence ? `<tr><td>Confidence</td><td>${esc(p.height_confidence)}</td></tr>` : ''}
    ${p.height_source ? `<tr><td>Height from</td><td>${esc(p.height_source)}</td></tr>` : ''}
    ${p.footprint_source ? `<tr><td>Footprint</td><td>${esc(p.footprint_source.replace(/^auto: /, 'auto · '))}${p.trace_reason ? ` (${esc(p.trace_reason)})` : ''}</td></tr>` : ''}
    ${p.address ? `<tr><td>Address</td><td>${esc(p.address)}</td></tr>` : ''}
    ${p.developer ? `<tr><td>Developer</td><td>${esc(p.developer)}</td></tr>` : ''}
    <tr><td>Source</td><td>${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>` : esc(p.source_url)}</td></tr>
    <tr><td>Checked</td><td>${esc(p.last_checked)}</td></tr></table>`;
  pop.hidden = false;

// ---------------------------------------------------------------------------
// Trace mode: top-down orthographic map (land use + base footprints + proposal outlines) for
// drawing a new proposal footprint by tapping its corners; exports a GeoJSON Feature (WGS84)
// ready to paste into data/proposals.geojson.
// ---------------------------------------------------------------------------
const trace = { on: false, cx: 0, cn: 0, half: 400, pts: [], closed: false, pointers: new Map(), tap: null, prev: null,
  target: null };
const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 20000);
orthoCam.up.set(0, 0, -1); // north up
const traceOv = $('traceov');
const SVGNS = 'http://www.w3.org/2000/svg';

function localToLonLat(e, n) {
  // Inverse transverse Mercator, UTM zone 12N on GRS80 (EPSG:26912), local frame from terrain.json origin.
  const o = world.tmeta.origin, a = 6378137, f = 1 / 298.257222101, k0 = 0.9996, lon0 = -111 * Math.PI / 180;
  const e2 = f * (2 - f), ep2 = e2 / (1 - e2), e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
  const x = e + o.utm_e - 500000, y = n + o.utm_n;
  const mu = y / k0 / (a * (1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256));
  const p1 = mu + (3 * e1 / 2 - 27 * e1 ** 3 / 32) * Math.sin(2 * mu) + (21 * e1 ** 2 / 16 - 55 * e1 ** 4 / 32) * Math.sin(4 * mu) +
    (151 * e1 ** 3 / 96) * Math.sin(6 * mu) + (1097 * e1 ** 4 / 512) * Math.sin(8 * mu);
  const s1 = Math.sin(p1), c1 = Math.cos(p1), t1 = Math.tan(p1) ** 2, C1 = ep2 * c1 * c1;
  const N1 = a / Math.sqrt(1 - e2 * s1 * s1), R1 = a * (1 - e2) / (1 - e2 * s1 * s1) ** 1.5, D = x / (N1 * k0);
  const lat = p1 - (N1 * Math.tan(p1) / R1) * (D * D / 2 - (5 + 3 * t1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * D ** 4 / 24 +
    (61 + 90 * t1 + 298 * C1 + 45 * t1 * t1 - 252 * ep2 - 3 * C1 * C1) * D ** 6 / 720);
  const lon = lon0 + (D - (1 + 2 * t1 + C1) * D ** 3 / 6 + (5 - 2 * C1 + 28 * t1 - 3 * C1 * C1 + 8 * ep2 + 24 * t1 * t1) * D ** 5 / 120) / c1;
  return [lon * 180 / Math.PI, lat * 180 / Math.PI];
}

function traceView() {
  // fit the orthographic frustum to the window around (cx, cn); `half` = half the view height in m
  const w = window.innerWidth, h = window.innerHeight, hw = trace.half * w / h;
  const ext = world.tmeta.extent;
  trace.cx = THREE.MathUtils.clamp(trace.cx, ext.xmin, ext.xmax);
  trace.cn = THREE.MathUtils.clamp(trace.cn, ext.ymin, ext.ymax);
  Object.assign(orthoCam, { left: -hw, right: hw, top: trace.half, bottom: -trace.half });
  orthoCam.position.set(trace.cx, 4000, -trace.cn);
  orthoCam.lookAt(trace.cx, 0, -trace.cn);
  orthoCam.updateProjectionMatrix();
  orthoCam.updateMatrixWorld();
  drawTraceOverlay();
  requestRender();
}
const toScreen = (e, n) => { const w = window.innerWidth, h = window.innerHeight, k = h / (2 * trace.half);
  return [w / 2 + (e - trace.cx) * k, h / 2 - (n - trace.cn) * k]; };
const toLocal = (x, y) => { const w = window.innerWidth, h = window.innerHeight, k = 2 * trace.half / h;
  return [trace.cx + (x - w / 2) * k, trace.cn - (y - h / 2) * k]; };

function renderTrace() {
  // top-down, no fog, no SSAO; shadows fitted to the visible area so roofs read as footprints
  const tgt = new THREE.Vector3(trace.cx, heightAt(trace.cx, -trace.cn), -trace.cn);
  fogStart.value = 1e9;
  const probe = tgt.clone().setY(tgt.y + trace.half * 1.15 * Math.max(1, window.innerWidth / window.innerHeight));
  fitShadow({ position: probe }, tgt);
  renderer.shadowMap.needsUpdate = shadowDirty;
  shadowDirty = false;
  renderer.setRenderTarget(null);
  renderer.render(scene, orthoCam);
}

function polyArea(pts) {
  let a = 0;
  for (let i = 0; i < pts.length; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length]; a += x1 * y2 - x2 * y1; }
  return a / 2;
}

function drawTraceOverlay() {
  const svg = traceOv;
  svg.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
  const parts = [];
  // proposal footprints already placed (status colour outline + id)
  for (const p of world.proposals) {
    const col = p.status === 'existing' ? '#3FA7B5' : p.status === 'stalled' ? '#777' : STATUS_HEX[p.status];
    const tgt = p.id === trace.target;
    let lx = 0, ly = 0, cnt = 0;
    for (const poly of p.footprint) for (const ring of poly) {
      const d = [];
      for (let i = 0; i < ring.length; i += 2) { const [x, y] = toScreen(ring[i], ring[i + 1]); d.push(`${x.toFixed(1)},${y.toFixed(1)}`);
        if (ring === poly[0]) { lx += x; ly += y; cnt++; } }
      parts.push(tgt
        ? `<polygon points="${d.join(' ')}" fill="${col}" fill-opacity="0.12" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="6 4"/>`
        : `<polygon points="${d.join(' ')}" fill="${col}" fill-opacity="0.18" stroke="${col}" stroke-width="2"/>`);
    }
    if (cnt) parts.push(`<text x="${(lx / cnt).toFixed(1)}" y="${(ly / cnt).toFixed(1)}" text-anchor="middle" dy="4" fill="#1d1d1f">${esc(p.id)}</text>`);
  }
  // the footprint being traced
  const P = trace.pts.map(([e, n]) => toScreen(e, n));
  if (P.length) {
    const d = P.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    parts.push(trace.closed
      ? `<polygon points="${d}" fill="#E59CA5" fill-opacity="0.35" stroke="#C0392B" stroke-width="2.5"/>`
      : `<polyline points="${d}" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 4"/>`);
    P.forEach(([x, y], i) => parts.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i === 0 && !trace.closed && P.length >= 3 ? 11 : 6}"
      fill="${i === 0 ? '#C0392B' : '#fff'}" stroke="#C0392B" stroke-width="2.5"/>`));
  }
  svg.innerHTML = parts.join('');
  const n = trace.pts.length;
  $('traceinfo').textContent = trace.closed
    ? `${n} corners · ${Math.abs(polyArea(trace.pts)).toFixed(0)} m²`
    : n ? `${n} corner${n > 1 ? 's' : ''}${n >= 3 ? ' · tap the first corner to close' : ''}` : `scale: ${(trace.half * 2).toFixed(0)} m tall`;
  $('tracecopy').disabled = !trace.closed;
}

function setTrace(on) {
  if (on === trace.on) return;
  trace.on = on;
  orbit.enabled = !on;
  $('tracetog').classList.toggle('on', on);
  $('tracebar').hidden = !on;
  traceOv.classList.toggle('active', on);
  $('frame').style.visibility = on ? 'hidden' : '';
  $('legend').hidden = on;
  $('popup').hidden = true;
  // darker roofs so base footprints read against the land-use ground, like an aerial basemap
  world.baseMat?.color.set(on ? '#b3afa6' : '#ffffff');
  if (on) {
    const bar = $('bar').getBoundingClientRect(); // the top bar wraps on narrow screens
    $('tracebar').style.top = `${Math.round(bar.bottom + 8)}px`;
    trace.cx = orbit.target.x; trace.cn = -orbit.target.z;
    trace.half = THREE.MathUtils.clamp(orbit.r * 0.25, 120, 2500);
    fillTraceList();
    // hide the extruded proposals so the base footprints under them show; outlines mark them instead
    world.propMeshes.forEach((m) => { m.visible = false; });
    traceView();
  } else {
    world.propMeshes.forEach((m) => { m.visible = true; });
    shadowDirty = true;
    fitShadow(camera, orbit.target, true);
    $('copybox').hidden = true;
  }
  requestRender();
}

function traceTap(x, y) {
  if (trace.closed) return;
  const P = trace.pts.map(([e, n]) => toScreen(e, n));
  if (P.length >= 3 && Math.hypot(P[0][0] - x, P[0][1] - y) <= 22) trace.closed = true;
  else {
    const [e, n] = toLocal(x, y);
    trace.pts.push([Math.round(e * 100) / 100, Math.round(n * 100) / 100]);
  }
  drawTraceOverlay();
}

function traceZoom(f, x, y) {
  // zoom about the screen point (x, y)
  const [e0, n0] = toLocal(x, y);
  trace.half = THREE.MathUtils.clamp(trace.half * f, 25, 5000);
  const [e1, n1] = toLocal(x, y);
  trace.cx += e0 - e1; trace.cn += n0 - n1;
  traceView();
}

const tracePair = () => { if (trace.pointers.size < 2) return null; const [a, b] = [...trace.pointers.values()];
  return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
traceOv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try { traceOv.setPointerCapture(e.pointerId); } catch { /* ignore */ }
  trace.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  trace.tap = trace.pointers.size === 1 ? { x: e.clientX, y: e.clientY, t: performance.now() } : null;
  trace.prev = tracePair();
});
traceOv.addEventListener('pointermove', (e) => {
  const p = trace.pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (trace.tap && Math.hypot(e.clientX - trace.tap.x, e.clientY - trace.tap.y) > 8) trace.tap = null;
  if (trace.pointers.size >= 2) {
    const pr = tracePair();
    if (trace.prev && pr) {
      const k = 2 * trace.half / window.innerHeight;
      trace.cx -= (pr.x - trace.prev.x) * k; trace.cn += (pr.y - trace.prev.y) * k;
      if (pr.d > 0 && trace.prev.d > 0) traceZoom(trace.prev.d / pr.d, pr.x, pr.y); else traceView();
    }
    trace.prev = pr;
  } else if (!trace.tap) {
    const k = 2 * trace.half / window.innerHeight;
    trace.cx -= dx * k; trace.cn += dy * k;
    traceView();
  }
});
for (const t of ['pointerup', 'pointercancel']) traceOv.addEventListener(t, (e) => {
  if (!trace.pointers.has(e.pointerId)) return;
  trace.pointers.delete(e.pointerId);
  if (e.type === 'pointerup' && trace.tap && trace.pointers.size === 0 && performance.now() - trace.tap.t < 600) traceTap(e.clientX, e.clientY);
  trace.tap = null;
  trace.prev = tracePair();
});
traceOv.addEventListener('wheel', (e) => { e.preventDefault(); traceZoom(Math.exp(e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
traceOv.addEventListener('contextmenu', (e) => e.preventDefault());

function traceFeature(id) {
  const ring = trace.pts.map(([e, n]) => localToLonLat(e, n).map((v) => Math.round(v * 1e7) / 1e7));
  if (polyArea(trace.pts) < 0) ring.reverse(); // RFC 7946: exterior ring counter-clockwise
  ring.push(ring[0]);
  const day = new Date().toISOString().slice(0, 10);
  // any footprint_source not starting with "auto:" / "needs_trace" is kept by scripts/auto_footprints.py
  return { type: 'Feature', properties: { id, footprint_source: `traced in viewer ${day}` }, geometry: { type: 'Polygon', coordinates: [ring] } };
}

// needs_trace list: footprints auto_footprints.py could not place with confidence, in id order
function traceTodo() { return (world.proposals || []).filter((p) => p.footprint_source === 'needs_trace'); }

function fillTraceList() {
  const todo = traceTodo(), sel = $('tracelist');
  $('tracetodo').hidden = !todo.length;
  const keep = sel.value;
  sel.innerHTML = todo.map((p) => `<option value="${esc(p.id)}">${esc(p.id)} · ${esc(p.address || p.name)}</option>`).join('');
  if (keep && todo.some((p) => p.id === keep)) sel.value = keep;
}

function jumpTo(id) {
  const p = world.proposals.find((q) => q.id === id);
  if (!p) return;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const poly of p.footprint) for (let i = 0; i < poly[0].length; i += 2) {
    x0 = Math.min(x0, poly[0][i]); x1 = Math.max(x1, poly[0][i]); y0 = Math.min(y0, poly[0][i + 1]); y1 = Math.max(y1, poly[0][i + 1]);
  }
  trace.target = id;
  trace.pts = []; trace.closed = false; $('copybox').hidden = true;
  trace.cx = (x0 + x1) / 2; trace.cn = (y0 + y1) / 2;
  trace.half = THREE.MathUtils.clamp(Math.max(x1 - x0, y1 - y0) * 1.6, 70, 600);
  $('tracelist').value = id;
  setStatus(`<b>${esc(p.id)}</b> ${esc(p.name)} · ${esc(p.address)} · ${p.storeys ? `${p.storeys} storeys · ` : ''}needs trace: ${esc(p.trace_reason || '')}. ` +
    'Dashed red = the auto footprint in use now; trace the real one, then Copy GeoJSON.');
  traceView();
}

$('tracetog').addEventListener('click', () => setTrace(!trace.on));
$('tracejump').addEventListener('click', () => jumpTo($('tracelist').value));
$('tracenext').addEventListener('click', () => {
  const todo = traceTodo();
  if (!todo.length) return;
  const k = todo.findIndex((p) => p.id === trace.target);
  jumpTo(todo[(k + 1) % todo.length].id);
});
$('tracedone').addEventListener('click', () => setTrace(false));
$('traceundo').addEventListener('click', () => {
  if (trace.closed) trace.closed = false; else trace.pts.pop();
  $('copybox').hidden = true;
  drawTraceOverlay();
});
$('traceclear').addEventListener('click', () => { trace.pts = []; trace.closed = false; $('copybox').hidden = true; drawTraceOverlay(); });
$('tracecopy').addEventListener('click', async () => {
  const used = world.proposals.map((p) => p.id);
  const next = 'P' + String(Math.max(0, ...used.map((v) => parseInt(v.replace(/\D/g, ''), 10) || 0)) + 1).padStart(3, '0');
  const id = (window.prompt('Proposal id for this footprint (must match its proposals.csv row):', trace.target || next) || '').trim();
  if (!id) return;
  const txt = JSON.stringify(traceFeature(id));
  window.__lastTrace = txt;
  const box = $('copybox');
  try {
    await navigator.clipboard.writeText(txt);
    box.hidden = true;
    setStatus(`Copied GeoJSON Feature <b>${esc(id)}</b> (${trace.pts.length} corners). Paste it into the features list of data/proposals.geojson, then run <code>make proposals</code> (it replaces the auto footprint for ${esc(id)}).`);
  } catch {
    // no clipboard access (http, or permission refused): show it selected for a manual copy
    box.value = txt; box.hidden = false; box.focus(); box.select();
    setStatus('Clipboard unavailable: the GeoJSON is selected in the Trace panel; tap Copy on the selection.');
  }
});

// ---------------------------------------------------------------------------
// Render PNG: tiled, 2× supersampled off-screen render (Safari/iPadOS safe)
// ---------------------------------------------------------------------------
function slugify(s) { return s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

function drawNameChip(ctx, name, W, H) {
  // docs/scope.md: bottom-left, dark rounded rect, white bold sans, chip 4% of frame height
  const bh = Math.round(H * 0.04), fs = Math.round(bh * 0.56), pad = Math.round(bh * 0.42);
  const mg = Math.round(H * 0.025);
  ctx.font = `700 ${fs}px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif`;
  const bw = Math.min(W - 2 * mg, Math.ceil(ctx.measureText(name).width) + 2 * pad);
  const x = mg, y = H - mg - bh;
  ctx.fillStyle = 'rgba(24, 24, 27, 0.88)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, bw, bh, bh * 0.28); else ctx.rect(x, y, bw, bh);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.textBaseline = 'middle';
  ctx.fillText(name, x + pad, y + bh / 2 + fs * 0.04, bw - 2 * pad);
}

async function renderImage(W, H, { chip = true, progress = () => {} } = {}) {
  // Draws the current view into a W×H 2D canvas in tiles. Each tile is rendered at SS× into a
  // render target of at most TILE_MAX² (plus a margin so SSAO has context across seams), box-
  // downsampled on the GPU, read back and pasted. Peak GPU use stays ~40 MB whatever W×H is.
  if (W * H > CANVAS_MAX_PX) throw new Error(`${W}×${H} exceeds Safari's ${CANVAS_MAX_PX / 1048576}M-pixel canvas limit`);
  const cam = world.currentCam;
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  const gl = renderer.getContext();
  const cap = Math.min(TILE_MAX, renderer.capabilities.maxTextureSize, gl.getParameter(gl.MAX_RENDERBUFFER_SIZE));
  const M = 32 * SS;                                       // tile margin, supersampled px
  const inner = cap - 2 * M - SS;
  const nx = Math.ceil(W * SS / inner), ny = Math.ceil(H * SS / inner);
  const tw = Math.ceil(W / nx), th = Math.ceil(H / ny);    // tile size, output px
  const bw = tw * SS + 2 * M, bh = th * SS + 2 * M;
  const big = new THREE.WebGLRenderTarget(bw, bh, { colorSpace: THREE.SRGBColorSpace, samples: 0,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
  const small = new THREE.WebGLRenderTarget(bw / SS, bh / SS, { colorSpace: THREE.SRGBColorSpace, depthBuffer: false });
  const saved = { aspect: camera.aspect };
  sun.shadow.map?.dispose(); sun.shadow.map = null; sun.shadow.mapSize.set(4096, 4096);
  rendering = true;
  try {
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    fitShadow(camera, orbit.target, true);
    const pix = new Uint8Array(small.width * small.height * 4);
    const img = new ImageData(small.width, small.height), rowB = small.width * 4, m = M / SS;
    for (let iy = 0; iy < ny; iy++) for (let ix = 0; ix < nx; ix++) {
      progress(iy * nx + ix + 1, nx * ny);
      await new Promise((r) => setTimeout(r, 0));
      const x0 = ix * tw, y0 = iy * th;
      if (x0 >= W || y0 >= H) continue;
      camera.setViewOffset(W * SS, H * SS, x0 * SS - M, y0 * SS - M, bw, bh);
      renderScene(big, bw, bh, $('ssao').checked);
      copyMat.uniforms.tSrc.value = big.texture;
      drawFS(copyMat, small);
      renderer.readRenderTargetPixels(small, 0, 0, small.width, small.height, pix);
      for (let y = 0; y < small.height; y++) img.data.set(pix.subarray((small.height - 1 - y) * rowB, (small.height - y) * rowB), y * rowB);
      ctx.putImageData(img, x0 - m, y0 - m, m, m, Math.min(tw, W - x0), Math.min(th, H - y0));
    }
  } finally {
    rendering = false;
    camera.clearViewOffset();
    camera.aspect = saved.aspect;
    camera.updateProjectionMatrix();
    renderer.setRenderTarget(null);
    big.dispose(); small.dispose();
    sun.shadow.map?.dispose(); sun.shadow.map = null; sun.shadow.mapSize.set(2048, 2048);
    fitShadow(camera, orbit.target, true);
    ensureAOTargets(1, 1);
    requestRender();
  }
  if (chip && cam) drawNameChip(ctx, cam.name, W, H);
  return out;
}

let lastPNG = null;
async function savePNG(canvas, fname) {
  // iPadOS Safari: an <a download> click on a blob: URL saves to Files/Downloads (iPadOS 13+).
  // If that is unavailable or throws, open the PNG in a new tab (long-press → Save to Photos);
  // if the pop-up is blocked, the status bar keeps tappable Save / Open / Share links.
  const blob = await new Promise((r, j) => canvas.toBlob((b) => (b ? r(b) : j(new Error('PNG encoding failed'))), 'image/png'));
  if (lastPNG) URL.revokeObjectURL(lastPNG.url);
  const url = URL.createObjectURL(blob);
  lastPNG = { url, fname, blob };
  let how = 'downloaded';
  try {
    const a = document.createElement('a');
    if (!('download' in a)) throw new Error('no download attribute');
    a.href = url; a.download = fname; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
  } catch {
    how = window.open(url, '_blank') ? 'opened in a new tab' : 'ready';
  }
  const canShare = navigator.canShare?.({ files: [new File([blob], fname, { type: 'image/png' })] });
  setStatus(`<b>${esc(fname)}</b> (${canvas.width}×${canvas.height}) ${how}. ` +
    `<a href="${url}" download="${esc(fname)}">Save again</a> · <a href="${url}" target="_blank" rel="noopener">Open in new tab</a>` +
    (canShare ? ' · <a href="#" id="sharepng">Share…</a>' : '') + ' — commit it to renders/.');
  $('sharepng')?.addEventListener('click', (e) => {
    e.preventDefault();
    navigator.share({ files: [new File([lastPNG.blob], lastPNG.fname, { type: 'image/png' })] }).catch(() => {});
  });
  window.__lastRender = { fname, url, W: canvas.width, H: canvas.height };
}

function renderFilename(cam) {
  const nn = cam ? cam.id : '00';
  const slug = cam ? (cam.slug || slugify(cam.name)) : 'custom';
  return `${nn}-${slug}_${world.dataDate || new Date().toISOString().slice(0, 10)}.png`;
}

async function renderPNG() {
  const [W, H] = RENDER_SIZES[$('aspect').value];
  const busy = $('busy');
  busy.style.display = 'flex';
  busy.textContent = 'Rendering…';
  try {
    const canvas = await renderImage(W, H, { progress: (i, n) => { busy.textContent = `Rendering tile ${i}/${n}…`; } });
    busy.textContent = 'Encoding PNG…';
    await new Promise((r) => setTimeout(r, 0));
    await savePNG(canvas, renderFilename(world.currentCam));
    canvas.width = canvas.height = 0; // release the 2D backing store now (Safari counts it against the page)
  } finally {
    busy.style.display = 'none';
  }
}
$('render').addEventListener('click', () => renderPNG().catch((e) => {
  setStatus(`Render failed: ${esc(e.message)}`); console.error(e);
}));

async function renderView(id, W, H) {
  // Headless entry point for scripts/render_views.py: returns a PNG data URL.
  applyCamera(id);
  const canvas = await renderImage(W, H);
  return canvas.toDataURL('image/png');
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
async function main() {
  resize();
  requestAnimationFrame(loop);
  setStatus('Loading terrain…');
  await buildTerrain();
  orbit.set(new THREE.Vector3(2600, 1200, 2600), new THREE.Vector3(-150, heightAt(-150, 100), 100));
  setStatus('Loading buildings, land use, proposals…');
  const [nb, clsmap, pj, cams] = await Promise.all([buildBase(), buildLanduse(), buildProposals(), getJSON('cameras.json')]);
  const hidden = hideBaseUnderProposals(pj);
  const nt = buildTrees(clsmap, buildingOccupancy());
  shadowDirty = true;
  buildLegend();
  buildCameraPicker(cams);
  const first = cams.cameras.find((c) => c.position);
  if (first) { $('cam').value = first.id; applyCamera(first.id); }
  $('render').disabled = false;
  setStatus(`${nb.toLocaleString()} buildings · ${world.proposals.length} proposals (${hidden} base hidden) · ${nt.toLocaleString()} trees`);
  setTimeout(() => { if (/buildings ·/.test(statusEl.textContent)) setStatus(''); }, 6000);
  window.__ready = true;
  requestRender();
}
main().catch((e) => { console.error(e); setStatus(`Failed to load: ${esc(e.message)}`); window.__error = String(e); });
window.__skyline = { world, camera, orbit, renderPNG, renderView, applyCamera, cameraJSON, requestRender, gpuMemoryMB, heightAt,
  trace, setTrace, traceFeature, localToLonLat };
</script>
