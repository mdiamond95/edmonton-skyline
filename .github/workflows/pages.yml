name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      # web/ becomes the site root; dist/ and renders/ sit beside index.html.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          for d in dist renders; do
            if [ -d "$d" ]; then cp -r "$d" "_site/$d"; fi
          done
          find _site -name .gitkeep -delete
          ls -R _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
